name: scan-on-github (manual)

# 注意：屈臣氏 API 對 GitHub Actions 的 IP 回 403（Akamai），所以排程掃描改在本機／家用主機執行
# （見 README「排程」）。這個 workflow 保留給手動測試：若某天 GitHub 不再被擋，可以把 schedule 加回來。
on:
  workflow_dispatch:
    inputs:
      shopee:
        description: "蝦皮來源 (biggo | none)"
        default: "biggo"
      max_lookups:
        description: "本次蝦皮查價上限（留空用設定檔）"
        default: ""

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Probe data sources
        run: python -m radar probe || true
      - name: Scan
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.max_lookups }}" ]; then EXTRA="--max-lookups ${{ github.event.inputs.max_lookups }}"; fi
          python -m radar scan --shopee "${{ github.event.inputs.shopee || 'biggo' }}" $EXTRA \
            --dashboard-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in web/data/latest.json web/data/alerts.json web/data/history.json web/data/status.json web/data/probe.json data/alert_state.json data/cache/shopee; do
            [ -e "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: scan $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
